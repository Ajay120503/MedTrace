version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: medtrace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: medtrace
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medtrace-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/medtrace
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-medtrace-access-secret-prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-medtrace-refresh-secret-prod}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=587
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=MedTrace <noreply@medtrace.com>
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medtrace-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - api
    volumes:
      - ./client/src:/app/src
    command: npm run dev -- --host

volumes:
  mongo-data: